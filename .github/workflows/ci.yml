name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install tooling
        run: >-
          python -m pip install --upgrade pip ruff mypy pytest pytest-cov
          pytest-homeassistant-custom-component
          "python-socketio>=5.0,<6.0"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Verify Home Assistant test harness
        run: python -c "import homeassistant"
      - name: Pytest
        run: pytest --cov=custom_components/catchsolar --cov-report=term-missing --cov-fail-under=75
      - name: Compile sources
        run: python -m compileall custom_components
