name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 6"
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install tooling
        run: >-
          python -m pip install --upgrade pip
          -r requirements-test.txt
      - name: Ruff
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Verify Home Assistant test harness
        run: python -c "import homeassistant; print(homeassistant.__version__)"
      - name: Pytest
        run: pytest --cov=custom_components/catchsolar --cov-report=term-missing --cov-fail-under=75
      - name: Compile sources
        run: python -m compileall custom_components

  latest-ha-canary:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install latest Home Assistant test harness
        run: >-
          python -m pip install --upgrade pip ruff mypy pytest pytest-cov
          pytest-homeassistant-custom-component
          "python-socketio>=5.0,<6.0"
      - name: Verify latest Home Assistant canary version
        run: >-
          python -c 'import homeassistant; from packaging.version import Version;
          version = Version(homeassistant.__version__); print(f"Home Assistant {version}");
          assert version >= Version("2026.7.0"), f"canary resolved {version}, expected >= 2026.7.0"'
      - name: Run latest Home Assistant canary
        run: >-
          pytest --cov=custom_components/catchsolar
          --cov-report=term-missing --cov-fail-under=75
