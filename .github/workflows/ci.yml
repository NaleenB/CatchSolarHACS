name: CI

on:
  push:
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install tooling
        run: >-
          python -m pip install --upgrade pip ruff mypy pytest pytest-cov
          pytest-homeassistant-custom-component
          "python-socketio>=5.0,<6.0"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Verify Home Assistant test harness
        run: python -c "import homeassistant"
      - name: Pytest
        run: pytest --cov=custom_components/catchsolar --cov-report=term-missing --cov-fail-under=75
      - name: Compile sources
        run: python -m compileall custom_components
